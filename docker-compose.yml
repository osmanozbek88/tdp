version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tdp-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tdp_password}
      POSTGRES_DB: ${POSTGRES_DB:-tdp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tdp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
